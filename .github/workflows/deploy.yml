name: Test and deploy to stage

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AZURE_SUBSCRIPTION: Azure subscription 1
  AZURE_RESOURCE_GROUP: WMDpy-Core-RG
  AZURE_ACR_NAME: wmdacr2026
  AZURE_STAGE_APP: waitaminute-go-stage
  IMAGE_NAME: waitaminute-go
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate and check templ output
        run: |
          templ generate
          git diff --exit-code -- internal/views/*_templ.go

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select existing subscription
        run: az account set --subscription "${{ env.AZURE_SUBSCRIPTION }}"

      - name: Log in to existing ACR
        shell: bash
        run: az acr login --name "${{ env.AZURE_ACR_NAME }}"

      - name: Build and push amd64 image
        shell: bash
        run: |
          LOGIN_SERVER="$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer --output tsv)"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_VERSION="${GITHUB_SHA}" \
            --tag "${LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --push \
            .

      - name: Configure and deploy stage app
        shell: bash
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ACS_ENDPOINT: ${{ secrets.ACS_ENDPOINT }}
          ACS_ACCESS_KEY: ${{ secrets.ACS_ACCESS_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          LOGIN_SERVER="$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer --output tsv)"
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_STAGE_APP}" \
            --output none \
            --settings \
              APP_ENV=production \
              PORT=8080 \
              WEBSITES_PORT=8080 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              SITE_DB=/home/data/site.db \
              SITE_URL="${SITE_URL}" \
              BUILD_VERSION="${GITHUB_SHA}" \
              ADMIN_PASSWORD_HASH="${ADMIN_PASSWORD_HASH}" \
              SESSION_SECRET="${SESSION_SECRET}" \
              CLARITY_ID=wp42rt08kj \
              ACS_ENDPOINT="${ACS_ENDPOINT}" \
              ACS_ACCESS_KEY="${ACS_ACCESS_KEY}" \
              NOTIFY_FROM="${NOTIFY_FROM}" \
              NOTIFY_TO="${NOTIFY_TO}"
          az webapp config container set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_STAGE_APP}" \
            --container-image-name "${LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          az webapp restart \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_STAGE_APP}"
